<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Manutenção - IFMS Coxim</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    .status-badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-pendente { background-color: #FEF3C7; color: #92400E; }
    .status-andamento { background-color: #DBEAFE; color: #1E40AF; }
    .status-concluido { background-color: #D1FAE5; color: #065F46; }

<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-12">

  <!-- CABEÇALHO INSTITUCIONAL -->

    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">

          IF
        </div>
        <div>
          <h1 class="font-bold text-base md:text-lg leading-tight">IFMS Campus Coxim</h1>
          <p class="text-xs text-emerald-200">Gestão de Ordens de Serviço (O.S.)</p>
        </div>
      </div>
      <button onclick="toggleView()" id="viewToggleBtn" class="bg-emerald-700 hover:bg-emerald-600 text-xs md:text-sm px-3 py-1.5 rounded-lg border border-emerald-500 transition flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen">
        <span id="viewToggleText">Modo Técnico</span>
      </button>
    </div>
  </header>

  <!-- ABAS DE NAVEGAÇÃO -->
  <div class="bg-white border-b shadow-sm">
    <div class="max-w-5xl mx-auto flex justify-around text-sm text-slate-600">
      <button onclick="switchTab('demandas')" id="tab-demandas" class="py-3 px-4 flex items-center gap-2 tab-active">
        <i class="fa-solid fa-list-check">
        <span>Demandas</span>
      </button>
      <button onclick="switchTab('nova')" id="tab-nova" class="py-3 px-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle">
        <span>Nova O.S.</span>
      </button>
      <button onclick="switchTab('relatorio')" id="tab-relatorio" class="py-3 px-4 flex items-center gap-2">
        <i class="fa-solid fa-chart-pie">
        <span>Resumo / Relatório</span>
      </button>
    </div>
  </div>

  <main class="max-w-5xl mx-auto p-4 space-y-6">

    <!-- SEÇÃO: LISTA DE DEMANDAS -->
    <section id="sec-demandas" class="space-y-4">
      <!-- FILTROS -->

        <div class="flex gap-2 flex-1 min-w-[200px]">

            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Impedido/Pausado">Impedido/Pausado</option>
            <option value="Concluído">Concluído</option>
          </select>
