<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Manutenção - IFMS Campus Coxim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase 11 SDK Modules -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            updateDoc, 
            onSnapshot, 
            addDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModule = {
            initializeApp,
            getApps,
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            getFirestore,
            collection,
            doc,
            setDoc,
            updateDoc,
            onSnapshot,
            addDoc
        };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ifms: {
                            green: '#008542',
                            red: '#D00914',
                            darkGreen: '#005c2e',
                            lightGreen: '#e6f4ed',
                            gray: '#f4f6f8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; font-size: 12pt; color: black; }
            .print-card { border: 1px solid #ccc; page-break-inside: avoid; margin-bottom: 15px; }
        }
        .print-only { display: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #008542; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIAS = ['Elétrico', 'Hidráulico', 'Pintura', 'Limpeza', 'Manutenção Geral'];
        const BLOCOS = ['Bloco A', 'Bloco B', 'Bloco C', 'Bloco Administrativo', 'Área de Convivência', 'Quadra Poliesportiva', 'Área Externa'];
        const PRIORIDADES = [
            { id: 'Baixa', color: 'bg-blue-100 text-blue-800 border-blue-300' },
            { id: 'Média', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
            { id: 'Alta', color: 'bg-orange-100 text-orange-800 border-orange-300' },
            { id: 'Urgente', color: 'bg-red-100 text-red-800 border-red-300' }
        ];

        const MOCK_INITIAL_DATA = [
            {
                id: 'OS-2024-001',
                dataAbertura: new Date(Date.now() - 3600000 * 24 * 2).toISOString(),
                categoria: 'Elétrico',
                bloco: 'Bloco A',
                sala: 'Sala 104 - Lab. Informática',
                solicitante: 'Prof. Ricardo Silva',
                contato: '(67) 99822-1100',
                resumo: 'Substituição de duas lâmpadas LED tubulares que estão piscando e atrapalhando a aula.',
                prioridade: 'Alta',
                status: 'Em Andamento',
                dataInicio: new Date(Date.now() - 3600000 * 20).toISOString(),
                fotoProblema: 'https://images.unsplash.com/photo-1550985616-10810253b84d?w=400&auto=format&fit=crop&q=60',
                fotoExecucao: null,
                motivoImpedimento: ''
            },
            {
                id: 'OS-2024-002',
                dataAbertura: new Date(Date.now() - 3600000 * 48).toISOString(),
                categoria: 'Hidráulico',
                bloco: 'Bloco B',
                sala: 'Banheiro Masculino Térreo',
                solicitante: 'Márcia Souza (Coord. Cursos)',
                contato: '(67) 99655-4433',
                resumo: 'Torneira da terceira pia com vazamento contínuo no gargalo.',
                prioridade: 'Média',
                status: 'Concluída',
                dataInicio: new Date(Date.now() - 3600000 * 40).toISOString(),
                dataConclusao: new Date(Date.now() - 3600000 * 10).toISOString(),
                fotoProblema: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=60',
                fotoExecucao: 'https://images.unsplash.com/photo-1585704032915-c3400ca199e7?w=400&auto=format&fit=crop&q=60',
                motivoImpedimento: ''
            }
        ];

        function App() {
            const [ordens, setOrdens] = useState([]);
            const [visao, setVisao] = useState('tecnico');
            const [abaAtiva, setAbaAtiva] = useState('lista');
            const [firebaseConectado, setFirebaseConectado] = useState(false);
            const [mostrarConfigFirebase, setMostrarConfigFirebase] = useState(false);
            const [userAuth, setUserAuth] = useState(null);

            // Chaves do Firebase
            const [configJson, setConfigJson] = useState(() => {
                return localStorage.getItem('ifms_firebase_cfg') || (typeof __firebase_config !== 'undefined' ? __firebase_config : '');
            });

            // Filtros
            const [filtroStatus, setFiltroStatus] = useState('Todos');
            const [filtroCategoria, setFiltroCategoria] = useState('Todas');
            const [busca, setBusca] = useState('');

            // Modais
            const [osSelecionada, setOsSelecionada] = useState(null);
            const [modalAcao, setModalAcao] = useState(null);
            const [motivoTexto, setMotivoTexto] = useState('');
            const [fotoInput, setFotoInput] = useState('');

            // Referências de Instâncias Firebase
            const [db, setDb] = useState(null);

            // Inicializar Firebase Firestore Real-Time
            useEffect(() => {
                let unsubscribeSnapshot = null;

                const setupFirebase = async () => {
                    try {
                        if (!window.FirebaseModule) return;

                        const { initializeApp, getApps, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, onSnapshot, doc, setDoc } = window.FirebaseModule;

                        let cfg = null;
                        if (configJson) {
                            try { cfg = typeof configJson === 'string' ? JSON.parse(configJson) : configJson; } catch(e){}
                        } else if (typeof __firebase_config !== 'undefined') {
                            cfg = JSON.parse(__firebase_config);
                        }

                        if (!cfg || !cfg.apiKey) {
                            // MODO DEMO / LOCALSTORAGE FALLBACK
                            setFirebaseConectado(false);
                            const localData = localStorage.getItem('ifms_coxim_os');
                            setOrdens(localData ? JSON.parse(localData) : MOCK_INITIAL_DATA);
                            return;
                        }

                        const app = getApps().length === 0 ? initializeApp(cfg) : getApps()[0];
                        const auth = getAuth(app);
                        const database = getFirestore(app);
                        setDb(database);

                        // Autenticação prévia obrigatória
                        const initAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (initAuthToken) {
                            await signInWithCustomToken(auth, initAuthToken).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }

                        onAuthStateChanged(auth, (user) => {
                            setUserAuth(user);
                            if (user) {
                                setFirebaseConectado(true);
                                const appId = typeof __app_id !== 'undefined' ? __app_id : 'ifms-coxim-app';
                                const colRef = collection(database, 'artifacts', appId, 'public', 'data', 'ordens_servico');

                                unsubscribeSnapshot = onSnapshot(colRef, (snapshot) => {
                                    const lista = [];
                                    snapshot.forEach((docItem) => {
                                        lista.push({ docId: docItem.id, ...docItem.data() });
                                    });
                                    // Ordenar mais recentes
                                    lista.sort((a,b) => new Date(b.dataAbertura) - new Date(a.dataAbertura));

                                    // Se coleção estiver vazia, popular com mocks iniciais no Firestore
                                    if (lista.length === 0) {
                                        MOCK_INITIAL_DATA.forEach(item => {
                                            const newDocRef = doc(colRef);
                                            setDoc(newDocRef, item);
                                        });
                                    } else {
                                        setOrdens(lista);
                                    }
                                }, (err) => {
                                    console.error("Erro Firestore Realtime:", err);
                                    setFirebaseConectado(false);
                                });
                            }
                        });

                    } catch(err) {
                        console.warn("Usando Fallback Local:", err);
                        setFirebaseConectado(false);
                        const localData = localStorage.getItem('ifms_coxim_os');
                        setOrdens(localData ? JSON.parse(localData) : MOCK_INITIAL_DATA);
                    }
                };

                setupFirebase();

                return () => {
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, [configJson]);

            // Salvar no LocalStorage se Firebase desativado
            useEffect(() => {
                if (!firebaseConectado) {
                    localStorage.setItem('ifms_coxim_os', JSON.stringify(ordens));
                }
            }, [ordens, firebaseConectado]);

            // Atualização de Ícones Lucide
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Adicionar Ordem no Firestore / LocalStorage
            const handleNovaOS = async (novaOS) => {
                const idNum = ordens.length + 1;
                const novoid = `OS-2024-${idNum.toString().padStart(3, '0')}`;
                const nova = {
                    ...novaOS,
                    id: novoid,
                    dataAbertura: new Date().toISOString(),
                    status: 'Pendente',
                    dataInicio: null,
                    dataConclusao: null,
                    fotoExecucao: null,
                    motivoImpedimento: ''
                };

                if (firebaseConectado && db && userAuth) {
                    try {
                        const { collection, addDoc } = window.FirebaseModule;
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ifms-coxim-app';
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ordens_servico'), nova);
                    } catch(e) {
                        alert("Erro ao enviar pro Firebase. Salvando localmente.");
                        setOrdens([nova, ...ordens]);
                    }
                } else {
                    setOrdens([nova, ...ordens]);
                }

                alert('Ordem de Serviço registrada com sucesso!');
                setAbaAtiva('lista');
            };

            // Atualizar Ordem no Firestore / LocalStorage
            const atualizarOS = async (targetId, updates) => {
                if (firebaseConectado && db && userAuth) {
                    try {
                        const { collection, getDocs, updateDoc, doc } = window.FirebaseModule;
                        const osItem = ordens.find(o => o.id === targetId || o.docId === targetId);
                        if (osItem && osItem.docId) {
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'ifms-coxim-app';
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ordens_servico', osItem.docId);
                            await updateDoc(docRef, updates);
                        }
                    } catch(e) {
                        console.error("Erro atualização Firebase:", e);
                    }
                } else {
                    setOrdens(ordens.map(os => (os.id === targetId || os.docId === targetId) ? { ...os, ...updates } : os));
                }
            };

            const handleIniciarDemanda = (id) => {
                atualizarOS(id, { status: 'Em Andamento', dataInicio: new Date().toISOString() });
                setModalAcao(null);
            };

            const handleConcluirDemanda = (id) => {
                atualizarOS(id, { 
                    status: 'Concluída', 
                    dataConclusao: new Date().toISOString(),
                    fotoExecucao: fotoInput || null 
                });
                setFotoInput('');
                setModalAcao(null);
            };

            const handleSalvarImpedimento = (id) => {
                atualizarOS(id, { motivoImpedimento: motivoTexto });
                setMotivoTexto('');
                setModalAcao(null);
            };

            // Filtragem
            const ordensFiltradas = useMemo(() => {
                return ordens.filter(os => {
                    const matchStatus = filtroStatus === 'Todos' || os.status === filtroStatus;
                    const matchCat = filtroCategoria === 'Todas' || os.categoria === filtroCategoria;
                    const matchBusca = (os.resumo || '').toLowerCase().includes(busca.toLowerCase()) || 
                                       (os.bloco || '').toLowerCase().includes(busca.toLowerCase()) ||
                                       (os.sala || '').toLowerCase().includes(busca.toLowerCase()) ||
                                       (os.id || '').toLowerCase().includes(busca.toLowerCase());
                    return matchStatus && matchCat && matchBusca;
                });
            }, [ordens, filtroStatus, filtroCategoria, busca]);

            const handleSimularFoto = (setter) => {
                const imagensSample = [
                    'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=400&auto=format&fit=crop&q=60',
                    'https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=400&auto=format&fit=crop&q=60',
                    'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=400&auto=format&fit=crop&q=60'
                ];
                const random = imagensSample[Math.floor(Math.random() * imagensSample.length)];
                setter(random);
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* CABEÇALHO DA INSTITUIÇÃO */}
                    <header class="bg-ifms-green text-white shadow-lg no-print">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                            <div class="flex items-center space-x-3">
                                <div class="bg-white text-ifms-green font-black p-2 rounded-lg text-xl tracking-wider border-2 border-ifms-red">
                                    IFMS
                                </div>
                                <div>
                                    <h1 class="font-bold text-lg leading-tight">Instituto Federal de MS</h1>
                                    <p class="text-xs text-green-100 flex items-center gap-1">
                                        <i data-lucide="map-pin" class="w-3 h-3"></i> Campus Coxim &bull; Manutenção Predial
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                {/* INDICADOR FIREBASE TEMPO REAL */}
                                <button 
                                    onClick={() => setMostrarConfigFirebase(!mostrarConfigFirebase)}
                                    class={`px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 transition ${firebaseConectado ? 'bg-emerald-700 text-white border border-emerald-400' : 'bg-amber-600 text-white border border-amber-300'}`}
                                    title="Clique para configurar conexão com Nuvem Firebase"
                                >
                                    <span class={`w-2 h-2 rounded-full ${firebaseConectado ? 'bg-emerald-300 animate-pulse' : 'bg-amber-200'}`}></span>
                                    {firebaseConectado ? 'Nuvem Conectada' : 'Modo Demo (Local)'}
                                </button>

                                {/* SELEÇÃO DE PERFIL / MODO */}
                                <div class="flex items-center bg-ifms-darkGreen p-1 rounded-xl">
                                    <button 
                                        onClick={() => setVisao('tecnico')} 
                                        class={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${visao === 'tecnico' ? 'bg-white text-ifms-green shadow' : 'text-green-100 hover:text-white'}`}
                                    >
                                        <i data-lucide="wrench" class="w-4 h-4"></i>
                                        Oficial (Celular)
                                    </button>
                                    <button 
                                        onClick={() => setVisao('solicitante')} 
                                        class={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${visao === 'solicitante' ? 'bg-white text-ifms-green shadow' : 'text-green-100 hover:text-white'}`}
                                    >
                                        <i data-lucide="user-check" class="w-4 h-4"></i>
                                        Gestão / Solicitante
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* BANNER DE CONFIGURAÇÃO DO FIREBASE */}
                    {mostrarConfigFirebase && (
                        <div class="bg-gray-800 text-white p-4 shadow-inner no-print">
                            <div class="max-w-4xl mx-auto space-y-3 text-xs">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-amber-400 flex items-center gap-1.5">
                                        <i data-lucide="cloud" class="w-4 h-4"></i> Configuração da Nuvem Firebase (Sincronização entre Computador e Celular)
                                    </h4>
                                    <button onClick={() => setMostrarConfigFirebase(false)} class="text-gray-400 hover:text-white font-bold">✕ Fechar</button>
                                </div>
                                <p class="text-gray-300">
                                    Para sincronizar os chamados em tempo real entre computadores e celulares no IFMS Coxim, insira abaixo a configuração JSON do seu projeto Firebase Console. Se deixado em branco, a aplicação continuará salvando os dados no navegador.
                                </p>
                                <textarea 
                                    rows="3"
                                    value={configJson}
                                    onChange={(e) => setConfigJson(e.target.value)}
                                    placeholder='Ex: {"apiKey": "AIzaSy...", "authDomain": "app.firebaseapp.com", "projectId": "app-id"}'
                                    class="w-full p-2 text-gray-900 bg-white rounded font-mono text-xs focus:ring-2 focus:ring-ifms-green"
                                ></textarea>
                                <div class="flex justify-end gap-2">
                                    <button 
                                        onClick={() => {
                                            localStorage.removeItem('ifms_firebase_cfg');
                                            setConfigJson('');
                                        }}
                                        class="px-3 py-1 bg-red-600 text-white rounded font-bold"
                                    >
                                        Limpar Chaves
                                    </button>
                                    <button 
                                        onClick={() => {
                                            localStorage.setItem('ifms_firebase_cfg', configJson);
                                            window.location.reload();
                                        }}
                                        class="px-4 py-1 bg-ifms-green text-white rounded font-bold"
                                    >
                                        Salvar e Conectar Nuvem
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAVEGAÇÃO SECUNDÁRIA */}
                    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm no-print">
                        <div class="max-w-7xl mx-auto px-4 flex justify-between overflow-x-auto">
                            <div class="flex space-x-1 py-2">
                                <button 
                                    onClick={() => setAbaAtiva('lista')}
                                    class={`px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition ${abaAtiva === 'lista' ? 'bg-ifms-lightGreen text-ifms-green font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                                    Ordens de Serviço ({ordens.length})
                                </button>

                                <button 
                                    onClick={() => setAbaAtiva('nova')}
                                    class={`px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition ${abaAtiva === 'nova' ? 'bg-ifms-lightGreen text-ifms-green font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                                    Nova Demanda
                                </button>

                                <button 
                                    onClick={() => setAbaAtiva('dashboard')}
                                    class={`px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition ${abaAtiva === 'dashboard' ? 'bg-ifms-lightGreen text-ifms-green font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                                    Resumo do Mês
                                </button>

                                <button 
                                    onClick={() => setAbaAtiva('relatorio')}
                                    class={`px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition ${abaAtiva === 'relatorio' ? 'bg-ifms-lightGreen text-ifms-green font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="file-text" class="w-4 h-4"></i>
                                    Relatórios & PDF
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* CONTEÚDO PRINCIPAL (MANTIDO E INTEGRADO AO FIREBASE) */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4">

                        {visao === 'tecnico' && (
                            <div class="mb-4 bg-amber-50 border-l-4 border-amber-500 p-3 rounded shadow-sm flex items-start gap-3 no-print">
                                <i data-lucide="smartphone" class="w-6 h-6 text-amber-600 flex-shrink-0 mt-0.5"></i>
                                <div class="text-sm">
                                    <p class="font-bold text-amber-900">Modo Oficial de Manutenção (Mobile)</p>
                                    <p class="text-amber-700">Interface para celulares. As alterações feitas aqui são sincronizadas instantaneamente via banco de dados.</p>
                                </div>
                            </div>
                        )}

                        {/* ABA LISTA DE DEMANDAS */}
                        {abaAtiva === 'lista' && (
                            <div class="space-y-4">
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-3 items-center justify-between no-print">
                                    <div class="relative w-full md:w-72">
                                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Buscar O.S., bloco, sala..." 
                                            value={busca}
                                            onChange={(e) => setBusca(e.target.value)}
                                            class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ifms-green"
                                        />
                                    </div>

                                    <div class="flex flex-wrap w-full md:w-auto gap-2">
                                        <select 
                                            value={filtroStatus} 
                                            onChange={(e) => setFiltroStatus(e.target.value)}
                                            class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-ifms-green"
                                        >
                                            <option value="Todos">Todos os Status</option>
                                            <option value="Pendente">Pendente</option>
                                            <option value="Em Andamento">Em Andamento</option>
                                            <option value="Concluída">Concluída</option>
                                        </select>

                                        <select 
                                            value={filtroCategoria} 
                                            onChange={(e) => setFiltroCategoria(e.target.value)}
                                            class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-ifms-green"
                                        >
                                            <option value="Todas">Todas as Categorias</option>
                                            {CATEGORIAS.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {ordensFiltradas.length === 0 ? (
                                    <div class="bg-white rounded-xl p-8 text-center text-gray-500 border border-gray-200">
                                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 text-gray-300"></i>
                                        Nenhuma ordem de serviço encontrada.
                                    </div>
                                ) : (
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {ordensFiltradas.map((os) => {
                                            const prioridadeBadge = PRIORIDADES.find(p => p.id === os.prioridade) || PRIORIDADES[0];
                                            return (
                                                <div key={os.id || os.docId} class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition">
                                                    <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-start">
                                                        <div>
                                                            <span class="text-xs font-mono font-bold text-gray-500">{os.id}</span>
                                                            <h3 class="font-bold text-gray-800 text-base leading-snug">{os.bloco} - {os.sala}</h3>
                                                        </div>
                                                        <span class={`text-xs px-2.5 py-1 rounded-full font-bold border ${prioridadeBadge.color}`}>
                                                            {os.prioridade}
                                                        </span>
                                                    </div>

                                                    <div class="p-4 flex-1 space-y-3">
                                                        <div class="flex items-center gap-2 text-xs text-gray-600">
                                                            <span class="bg-gray-200 px-2 py-0.5 rounded font-semibold text-gray-700">{os.categoria}</span>
                                                            <span>•</span>
                                                            <span class="flex items-center gap-1">
                                                                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                                                {new Date(os.dataAbertura).toLocaleDateString('pt-BR')}
                                                            </span>
                                                        </div>

                                                        <p class="text-sm text-gray-700 font-normal line-clamp-3 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                                            "{os.resumo}"
                                                        </p>

                                                        <div class="text-xs text-gray-500">
                                                            <strong class="text-gray-700">Solicitante:</strong> {os.solicitante} {os.contato ? `(${os.contato})` : ''}
                                                        </div>

                                                        {os.fotoProblema && (
                                                            <div class="mt-2">
                                                                <span class="text-xs text-gray-500 block mb-1 font-medium">Foto Anexa:</span>
                                                                <img src={os.fotoProblema} alt="Problema" class="w-full h-32 object-cover rounded-lg border border-gray-200" />
                                                            </div>
                                                        )}

                                                        {os.motivoImpedimento && (
                                                            <div class="bg-red-50 border border-red-200 p-2.5 rounded-lg text-xs text-red-800">
                                                                <strong class="block font-semibold flex items-center gap-1 mb-0.5">
                                                                    <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-red-600"></i> Motivo de Impedimento:
                                                                </strong>
                                                                {os.motivoImpedimento}
                                                            </div>
                                                        )}

                                                        {os.fotoExecucao && (
                                                            <div class="mt-2 bg-green-50 p-2 rounded-lg border border-green-200">
                                                                <span class="text-xs text-green-800 font-bold block mb-1">Foto da Conclusão:</span>
                                                                <img src={os.fotoExecucao} alt="Execução" class="w-full h-28 object-cover rounded-md" />
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div class="p-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                                                        <div>
                                                            {os.status === 'Pendente' && (
                                                                <span class="inline-flex items-center gap-1 text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">
                                                                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Pendente
                                                                </span>
                                                            )}
                                                            {os.status === 'Em Andamento' && (
                                                                <span class="inline-flex items-center gap-1 text-xs font-bold text-blue-700 bg-blue-100 px-2.5 py-1 rounded-full">
                                                                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span> Em Andamento
                                                                </span>
                                                            )}
                                                            {os.status === 'Concluída' && (
                                                                <span class="inline-flex items-center gap-1 text-xs font-bold text-green-700 bg-green-100 px-2.5 py-1 rounded-full">
                                                                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Concluída
                                                                </span>
                                                            )}
                                                        </div>

                                                        <div class="flex gap-1">
                                                            {os.status === 'Pendente' && (
                                                                <button 
                                                                    onClick={() => handleIniciarDemanda(os.id || os.docId)} 
                                                                    class="bg-ifms-green hover:bg-ifms-darkGreen text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition"
                                                                >
                                                                    <i data-lucide="play" class="w-3.5 h-3.5"></i> Iniciar
                                                                </button>
                                                            )}

                                                            {os.status === 'Em Andamento' && (
                                                                <>
                                                                    <button 
                                                                        onClick={() => { setOsSelecionada(os); setModalAcao('impedimento'); setMotivoTexto(os.motivoImpedimento || ''); }} 
                                                                        class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg transition"
                                                                        title="Registrar motivo de impedimento"
                                                                    >
                                                                        <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => { setOsSelecionada(os); setModalAcao('concluir'); setFotoInput(os.fotoExecucao || ''); }} 
                                                                        class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition"
                                                                    >
                                                                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Concluir
                                                                    </button>
                                                                </>
                                                            )}

                                                            <button 
                                                                onClick={() => { setOsSelecionada(os); setModalAcao('detalhes'); }} 
                                                                class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold px-2.5 py-1.5 rounded-lg transition"
                                                            >
                                                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* OUTRAS ABAS MANTIDAS INTEGRALMENTE */}
                        {abaAtiva === 'nova' && (
                            <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-1 flex items-center gap-2">
                                    <i data-lucide="plus-circle" class="text-ifms-green"></i> Abrir Nova Ordem de Serviço
                                </h2>
                                <p class="text-sm text-gray-500 mb-6">Demanda sincronizada em tempo real com o Oficial do Campus Coxim.</p>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    handleNovaOS({
                                        categoria: formData.get('categoria'),
                                        bloco: formData.get('bloco'),
                                        sala: formData.get('sala'),
                                        solicitante: formData.get('solicitante'),
                                        contato: formData.get('contato'),
                                        prioridade: formData.get('prioridade'),
                                        resumo: formData.get('resumo'),
                                        fotoProblema: fotoInput
                                    });
                                }} class="space-y-4">
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Serviço / Categoria *</label>
                                            <select name="categoria" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green">
                                                {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Prioridade *</label>
                                            <select name="prioridade" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green">
                                                {PRIORIDADES.map(p => <option key={p.id} value={p.id}>{p.id}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Bloco *</label>
                                            <select name="bloco" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green">
                                                {BLOCOS.map(b => <option key={b} value={b}>{b}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Sala / Local Específico *</label>
                                            <input 
                                                type="text" 
                                                name="sala" 
                                                required 
                                                placeholder="Ex: Sala 102, Banheiro Masc." 
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green"
                                            />
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Nome do Solicitante *</label>
                                            <input 
                                                type="text" 
                                                name="solicitante" 
                                                required 
                                                placeholder="Seu nome completo" 
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green"
                                            />
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-700 mb-1">Telefone / Ramal</label>
                                            <input 
                                                type="text" 
                                                name="contato" 
                                                placeholder="(67) 9XXXX-XXXX" 
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Breve Resumo do Problema *</label>
                                        <textarea 
                                            name="resumo" 
                                            rows="3" 
                                            required 
                                            placeholder="Descreva o que precisa ser feito..." 
                                            class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-ifms-green"
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Foto do Problema (URL ou Simulação)</label>
                                        <div class="flex gap-2">
                                            <input 
                                                type="url" 
                                                value={fotoInput} 
                                                onChange={(e) => setFotoInput(e.target.value)} 
                                                placeholder="Cole a URL ou capture foto ->" 
                                                class="flex-1 p-2.5 border border-gray-300 rounded-lg text-sm"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => handleSimularFoto(setFotoInput)}
                                                class="px-3 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-xs font-semibold flex items-center gap-1"
                                            >
                                                <i data-lucide="camera" class="w-4 h-4"></i> Capturar
                                            </button>
                                        </div>
                                    </div>

                                    <div class="pt-4 flex justify-end gap-3">
                                        <button 
                                            type="button" 
                                            onClick={() => setAbaAtiva('lista')}
                                            class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-50"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            class="px-6 py-2 bg-ifms-green hover:bg-ifms-darkGreen text-white rounded-lg text-sm font-bold shadow transition"
                                        >
                                            Registrar Demanda
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {abaAtiva === 'dashboard' && (
                            <div class="space-y-6">
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p class="text-xs font-semibold text-gray-500">Total no Mês</p>
                                            <p class="text-2xl font-black text-gray-800">{ordens.length}</p>
                                        </div>
                                        <div class="p-3 bg-gray-100 rounded-lg text-gray-700">
                                            <i data-lucide="files" class="w-6 h-6"></i>
                                        </div>
                                    </div>

                                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p class="text-xs font-semibold text-green-600">Concluídas</p>
                                            <p class="text-2xl font-black text-green-700">{ordens.filter(o => o.status === 'Concluída').length}</p>
                                        </div>
                                        <div class="p-3 bg-green-100 rounded-lg text-green-700">
                                            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                                        </div>
                                    </div>

                                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p class="text-xs font-semibold text-blue-600">Em Andamento</p>
                                            <p class="text-2xl font-black text-blue-700">{ordens.filter(o => o.status === 'Em Andamento').length}</p>
                                        </div>
                                        <div class="p-3 bg-blue-100 rounded-lg text-blue-700">
                                            <i data-lucide="loader" class="w-6 h-6"></i>
                                        </div>
                                    </div>

                                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p class="text-xs font-semibold text-amber-600">Pendentes</p>
                                            <p class="text-2xl font-black text-amber-700">{ordens.filter(o => o.status === 'Pendente').length}</p>
                                        </div>
                                        <div class="p-3 bg-amber-100 rounded-lg text-amber-700">
                                            <i data-lucide="clock" class="w-6 h-6"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {abaAtiva === 'relatorio' && (
                            <div class="space-y-4">
                                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-wrap justify-between items-center gap-3 no-print">
                                    <div>
                                        <h2 class="font-bold text-gray-800">Relatório Mensal de Manutenção</h2>
                                        <p class="text-xs text-gray-500">Impressão PDF ou Baixar Planilha.</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button 
                                            onClick={() => window.print()}
                                            class="px-4 py-2 bg-ifms-green hover:bg-ifms-darkGreen text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow"
                                        >
                                            <i data-lucide="printer" class="w-4 h-4"></i> Imprimir / PDF
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* MODAIS (MANTIDOS INTEGRALMENTE) */}
                    {modalAcao && osSelecionada && (
                        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 space-y-4 border border-gray-200">
                                {modalAcao === 'impedimento' && (
                                    <>
                                        <h3 class="font-bold text-amber-800">Registrar Motivo de Impedimento</h3>
                                        <textarea 
                                            rows="3"
                                            value={motivoTexto}
                                            onChange={(e) => setMotivoTexto(e.target.value)}
                                            placeholder="Ex: Falta de peças no estoque..."
                                            class="w-full p-2 border border-gray-300 rounded text-xs"
                                        ></textarea>
                                        <div class="flex justify-end gap-2">
                                            <button onClick={() => setModalAcao(null)} class="px-3 py-1.5 bg-gray-200 rounded text-xs font-semibold">Cancelar</button>
                                            <button onClick={() => handleSalvarImpedimento(osSelecionada.id || osSelecionada.docId)} class="px-4 py-1.5 bg-amber-600 text-white rounded text-xs font-bold">Salvar</button>
                                        </div>
                                    </>
                                )}

                                {modalAcao === 'concluir' && (
                                    <>
                                        <h3 class="font-bold text-green-800">Finalizar Ordem de Serviço</h3>
                                        <div class="flex gap-2">
                                            <input 
                                                type="url" 
                                                value={fotoInput} 
                                                onChange={(e) => setFotoInput(e.target.value)} 
                                                placeholder="Link da foto de prova" 
                                                class="flex-1 p-2 border border-gray-300 rounded text-xs"
                                            />
                                            <button onClick={() => handleSimularFoto(setFotoInput)} class="px-2.5 py-1.5 bg-gray-200 rounded text-xs">Capturar</button>
                                        </div>
                                        <div class="flex justify-end gap-2 pt-2">
                                            <button onClick={() => setModalAcao(null)} class="px-3 py-1.5 bg-gray-200 rounded text-xs font-semibold">Cancelar</button>
                                            <button onClick={() => handleConcluirDemanda(osSelecionada.id || osSelecionada.docId)} class="px-4 py-1.5 bg-green-600 text-white rounded text-xs font-bold">Confirmar</button>
                                        </div>
                                    </>
                                )}

                                {modalAcao === 'detalhes' && (
                                    <>
                                        <h3 class="font-bold text-gray-800">{osSelecionada.id} - Detalhes</h3>
                                        <div class="text-xs space-y-1">
                                            <p><strong>Local:</strong> {osSelecionada.bloco} - {osSelecionada.sala}</p>
                                            <p><strong>Solicitante:</strong> {osSelecionada.solicitante}</p>
                                            <p><strong>Resumo:</strong> {osSelecionada.resumo}</p>
                                        </div>
                                        <button onClick={() => setModalAcao(null)} class="w-full py-2 bg-gray-200 rounded-lg font-bold text-xs">Fechar</button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
